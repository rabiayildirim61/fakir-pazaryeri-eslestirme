<script>
        let tsoftData = [];
        let pazarVerileri = {
            'Trendyol': [], 'Hepsiburada': [], 'Amazon': [], 'N11': [], 'İdefix': [], 'Beymen': [], 'Pazarama': []
        };
        let manuelEslesmeler = {
            'Trendyol': {}, 'Hepsiburada': {}, 'Amazon': {}, 'N11': {}, 'İdefix': {}, 'Beymen': {}, 'Pazarama': {}
        };
        let acilacakUrunler = {
            'Trendyol': {}, 'Hepsiburada': {}, 'Amazon': {}, 'N11': {}, 'İdefix': {}, 'Beymen': {}, 'Pazarama': {}
        };
        let aktifPazar = 'Trendyol';

        window.addEventListener('DOMContentLoaded', async () => {
            setTimeout(async () => {
                if (window.firebaseDb) {
                    try {
                        const { collection, getDocs } = window.firebaseMethods;
                        const querySnapshot = await getDocs(collection(window.firebaseDb, "eslesmeler"));
                        querySnapshot.forEach((docSnap) => {
                            let data = docSnap.data();
                            if (data.pazar && data.tKey) {
                                if (data.type === 'acilacak') {
                                    if (!acilacakUrunler[data.pazar]) acilacakUrunler[data.pazar] = {};
                                    acilacakUrunler[data.pazar][data.tKey] = true;
                                } else if (data.pIndex !== undefined) {
                                    if (!manuelEslesmeler[data.pazar]) manuelEslesmeler[data.pazar] = {};
                                    manuelEslesmeler[data.pazar][data.tKey] = data.pIndex;
                                }
                            }
                        });
                        console.log("Bulut hafızadan veriler başarıyla yüklendi.");
                    } catch (err) {
                        console.log("Buluttan veri çekerken hata:", err);
                    }
                }
            }, 1000);
        });

        document.getElementById('tsoftFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                tsoftData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                document.getElementById('tsoftDurum').innerText = `✅ T-Soft yüklendi (${tsoftData.length} ürün)`;
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('pazarFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                let sheetName = workbook.SheetNames[0];
                if (workbook.SheetNames.includes('Listelerim')) {
                    sheetName = 'Listelerim';
                }
                
                pazarVerileri[aktifPazar] = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                alert(`${aktifPazar} raporu başarıyla yüklendi! (${pazarVerileri[aktifPazar].length} ürün)`);
            };
            reader.readAsArrayBuffer(file);
        });

        function pazarSec(pazarAdi) {
            aktifPazar = pazarAdi;
            const pazarListesi = ['Trendyol', 'Hepsiburada', 'Amazon', 'N11', 'İdefix', 'Beymen', 'Pazarama'];
            pazarListesi.forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                btn.className = (p === pazarAdi) 
                    ? "px-5 py-2.5 rounded-lg font-semibold text-sm bg-blue-600 text-white shadow-sm transition"
                    : "px-5 py-2.5 rounded-lg font-semibold text-sm bg-white text-slate-600 border border-slate-300 hover:bg-slate-100 transition";
            });
            document.getElementById('aktifPazarBaslik').innerText = `${pazarAdi} Raporunu Yükle`;
            document.getElementById('pazarFile').value = "";
            document.getElementById('sonucAlani').classList.add('hidden');
        }

        function kolonDegeriBul(row, keys) {
            const rowKeys = Object.keys(row);
            for (let k of keys) {
                const foundKey = rowKeys.find(rk => rk.trim().toLowerCase() === k.toLowerCase());
                if (foundKey !== undefined && row[foundKey] !== undefined) {
                    return row[foundKey];
                }
            }
            return "";
        }

        window.manuelEsleKaydet = async function(tKodKey) {
            const secilenPazarIndex = document.getElementById(`select-${CSS.escape(tKodKey)}`).value;
            if(secilenPazarIndex === "") {
                alert("Lütfen pazar yerinden ilgili ürünü seçin.");
                return;
            }
            
            manuelEslesmeler[aktifPazar][tKodKey] = secilenPazarIndex;
            if (acilacakUrunler[aktifPazar][tKodKey]) delete acilacakUrunler[aktifPazar][tKodKey];

            if (window.firebaseDb) {
                try {
                    const { doc, setDoc } = window.firebaseMethods;
                    let docId = `${aktifPazar}_${tKodKey}`.replace(/[^a-zA-Z0-9]/g, "_");
                    await setDoc(doc(window.firebaseDb, "eslesmeler", docId), {
                        pazar: aktifPazar,
                        tKey: tKodKey,
                        pIndex: Number(secilenPazarIndex),
                        type: 'match'
                    });
                    alert("Eşleşme buluta kaydedildi! ☁️");
                } catch (err) {
                    console.log("Buluta kayıt hatası:", err);
                }
            }

            analiziBaslat();
        }

        window.acilacakIsaretle = async function(tKodKey) {
            if (!acilacakUrunler[aktifPazar]) acilacakUrunler[aktifPazar] = {};
            acilacakUrunler[aktifPazar][tKodKey] = true;
            if (manuelEslesmeler[aktifPazar][tKodKey] !== undefined) delete manuelEslesmeler[aktifPazar][tKodKey];

            if (window.firebaseDb) {
                try {
                    const { doc, setDoc } = window.firebaseMethods;
                    let docId = `${aktifPazar}_${tKodKey}`.replace(/[^a-zA-Z0-9]/g, "_");
                    await setDoc(doc(window.firebaseDb, "eslesmeler", docId), {
                        pazar: aktifPazar,
                        tKey: tKodKey,
                        type: 'acilacak'
                    });
                } catch (err) {
                    console.log("Buluta kayıt hatası:", err);
                }
            }

            alert("Ürün 'Açılacak Ürün (İş Planında)' olarak işaretlendi! 🚧");
            analiziBaslat();
        }

        window.acilacaktanCikar = async function(tKodKey) {
            if (acilacakUrunler[aktifPazar][tKodKey]) delete acilacakUrunler[aktifPazar][tKodKey];

            if (window.firebaseDb) {
                try {
                    const { doc, deleteDoc } = window.firebaseMethods;
                    let docId = `${aktifPazar}_${tKodKey}`.replace(/[^a-zA-Z0-9]/g, "_");
                    await deleteDoc(doc(window.firebaseDb, "eslesmeler", docId));
                } catch (err) {
                    console.log("Buluttan silme hatası:", err);
                }
            }

            alert("Ürün açılacaklar listesinden kaldırıldı.");
            analiziBaslat();
        }

        function analiziBaslat() {
            if(tsoftData.length === 0) {
                alert('Lütfen önce T-Soft ana kaynak raporunu yükleyin.');
                return;
            }
            if(pazarVerileri[aktifPazar].length === 0) {
                alert(`Lütfen önce ${aktifPazar} rapor dosyasını yükleyin.`);
                return;
            }

            document.getElementById('sonucAlani').classList.remove('hidden');
            document.getElementById('ozetBaslik').innerText = `📊 ${aktifPazar} Karşılaştırma Özeti`;

            const tablo = document.getElementById('tabloIcerik');
            const acilicakTablo = document.getElementById('acilicakTabloIcerik');
            const eslesmeyenTablo = document.getElementById('eslesmeyenTabloIcerik');
            
            tablo.innerHTML = "";
            acilicakTablo.innerHTML = "";
            eslesmeyenTablo.innerHTML = "";

            let eslesenSayisi = 0;
            let hataSayisi = 0;
            let acilicakSayisi = 0;
            let eslesmeyenSayisi = 0;

            let pazarBarkodMap = new Map();
            let pazarKodMap = new Map();
            let pazarIsimMap = new Map();
            let pazarMerchantMap = new Map();

            pazarVerileri[aktifPazar].forEach((pRow, idx) => {
                let pBarkod = String(kolonDegeriBul(pRow, ['barkod', 'barcode'])).trim();
                let pKod = String(kolonDegeriBul(pRow, ['web servis kodu', 'stok kodu', 'sku', 'stokkodu', 'tedarikçi stok kodu'])).trim();
                let pMerchant = String(kolonDegeriBul(pRow, ['merchant sku'])).trim();
                let pIsim = String(kolonDegeriBul(pRow, ['ürün adı', 'urun adi', 'title', 'product name'])).trim().toLowerCase();
                
                if(pBarkod) {
                    pBarkod.split(';').forEach(b => { if(b.trim()) pazarBarkodMap.set(b.trim(), idx); });
                }
                if(pKod) pazarKodMap.set(pKod, idx);
                if(pMerchant) pazarMerchantMap.set(pMerchant, idx);
                if(pIsim) pazarIsimMap.set(pIsim, idx);
            });

            let pazarSecenekleriHTML = `<option value="">-- Pazar Yerindeki Ürünü Seç --</option>`;
            pazarVerileri[aktifPazar].forEach((pRow, idx) => {
                let pIsim = kolonDegeriBul(pRow, ['ürün adı', 'urun adi', 'title', 'product name']);
                let pSku = kolonDegeriBul(pRow, ['merchant sku', 'stok kodu', 'sku']);
                pazarSecenekleriHTML += `<option value="${idx}">${pIsim || ('Ürün #' + idx)} (SKU: ${pSku || '-'})</option>`;
            });

            let htmlContent = "";
            let acilicakHtmlContent = "";
            let eslesmeyenHtmlContent = "";

            tsoftData.forEach((tRow, tIdx) => {
                let tBarkod = String(kolonDegeriBul(tRow, ['barkod', 'barcode'])).trim();
                let tKod = String(kolonDegeriBul(tRow, ['web servis kodu', 'stok kodu', 'sku', 'stokkodu', 'tedarikçi stok kodu'])).trim();
                let tIsim = String(kolonDegeriBul(tRow, ['ürün adı', 'urun adi', 'title', 'product name'])).trim();
                let tStok = Number(kolonDegeriBul(tRow, ['stok', 'stok miktari', 'miktar', 'adet'])) || 0;
                let tFiyat = Number(kolonDegeriBul(tRow, ['kdv dahil fiyat', 'satis fiyati', 'fiyat', 'tutar'])) || 0;

                let tUniqueKey = tKod || tBarkod || tIsim;
                let safeKey = tUniqueKey.replace(/['"\\#\s]/g, "_");

                // 1. Kontrol: İş planında açılacak olarak işaretlenmiş mi?
                if (acilacakUrunler[aktifPazar] && acilacakUrunler[aktifPazar][tUniqueKey]) {
                    acilicakSayisi++;
                    acilicakHtmlContent += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50">
                            <td class="p-3 font-medium">${tIsim}</td>
                            <td class="p-3 text-xs font-mono text-slate-500">Kod: ${tKod || '-'} | Barkod: ${tBarkod || '-'}</td>
                            <td class="p-3 text-blue-700 font-semibold">Stok: ${tStok} | Fiyat: ${tFiyat} TL</td>
                            <td class="p-3 text-center">
                                <button onclick="acilacaktanCikar('${tUniqueKey.replace(/'/g, "\\'")}')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded text-xs font-semibold shadow">
                                    Listeden Çıkar
                                </button>
                            </td>
                        </tr>
                    `;
                    return;
                }

                let eslesenPazarIndex = null;
                let yontem = "";

                if(manuelEslesmeler[aktifPazar][tUniqueKey] !== undefined) {
                    eslesenPazarIndex = manuelEslesmeler[aktifPazar][tUniqueKey];
                    yontem = '<span class="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-semibold">Buluttan Öğrenilmiş</span>';
                }
                else if(tBarkod && pazarBarkodMap.has(tBarkod)) {
                    eslesenPazarIndex = pazarBarkodMap.get(tBarkod);
                    yontem = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold">1. Aşama: Barkod</span>';
                } 
                else if(tKod && (pazarKodMap.has(tKod) || pazarMerchantMap.has(tKod))) {
                    eslesenPazarIndex = pazarKodMap.get(tKod) !== undefined ? pazarKodMap.get(tKod) : pazarMerchantMap.get(tKod);
                    yontem = '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-semibold">2. Aşama: Stok Kodu</span>';
                } 
                else if(tIsim && pazarIsimMap.has(tIsim.toLowerCase())) {
                    eslesenPazarIndex = pazarIsimMap.get(tIsim.toLowerCase());
                    yontem = '<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-semibold">3. Aşama: Ürün Adı</span>';
                }

                if(eslesenPazarIndex !== null && pazarVerileri[aktifPazar][eslesenPazarIndex] !== undefined) {
                    eslesenSayisi++;
                    let eslesenPazarRow = pazarVerileri[aktifPazar][eslesenPazarIndex];
                    let pStok = Number(kolonDegeriBul(eslesenPazarRow, ['stok', 'stok miktari', 'miktar', 'adet'])) || 0;
                    let pFiyat = Number(kolonDegeriBul(eslesenPazarRow, ['kdv dahil fiyat', 'satis fiyati', 'fiyat', 'tutar'])) || 0;

                    let hataListesi = [];
                    if(tStok <= 0 && pStok > 0) {
                        hataListesi.push('<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold">Stok Hatası: T-Soft\'ta 0, Pazar Yerinde Açık!</span>');
                    }
                    if(tFiyat > 0 && pFiyat > 0 && Math.abs(tFiyat - pFiyat) > 1) {
                        hataListesi.push('<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs font-bold">Fiyat Uyumsuzluğu</span>');
                    }

                    if(hataListesi.length > 0) {
                        hataSayisi++;
                        htmlContent += `
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="p-3">${yontem}</td>
                                <td class="p-3 font-medium">${tIsim}</td>
                                <td class="p-3 text-blue-700 font-semibold">Stok: ${tStok} | Fiyat: ${tFiyat} TL</td>
                                <td class="p-3 text-slate-700">Stok: ${pStok} | Fiyat: ${pFiyat} TL</td>
                                <td class="p-3 space-y-1">${hataListesi.join('<br>')}</td>
                            </tr>
                        `;
                    }
                } else {
                    eslesmeyenSayisi++;
                    let escapedKey = tUniqueKey.replace(/'/g, "\\'");
                    eslesmeyenHtmlContent += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50">
                            <td class="p-3 font-medium">${tIsim}<br><span class="text-xs text-slate-400 font-mono">Kod: ${tKod || '-'} | Barkod: ${tBarkod || '-'}</span></td>
                            <td class="p-3 text-blue-700 font-semibold">Stok: ${tStok} | Fiyat: ${tFiyat} TL</td>
                            <td class="p-3">
                                <select id="select-${safeKey}" class="w-full p-2 border border-slate-300 rounded text-xs bg-white mb-2">
                                    ${pazarSecenekleriHTML}
                                </select>
                            </td>
                            <td class="p-3 text-center space-y-2">
                                <button onclick="manuelEsleKaydet('${escapedKey}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-xs font-semibold shadow">
                                    Buluta Öğret
                                </button>
                                <button onclick="acilacakIsaretle('${escapedKey}')" class="w-full bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded text-xs font-semibold shadow">
                                    🚧 İş Planına Ekle
                                </button>
                            </td>
                        </tr>
                    `;
                }
            });

            tablo.innerHTML = htmlContent || `<tr><td colspan="5" class="p-6 text-center text-slate-500">Tebrikler! Eşleşen ürünlerde hiçbir hata bulunamadı. 🎉</td></tr>`;
            acilicakTablo.innerHTML = acilicakHtmlContent || `<tr><td colspan="4" class="p-6 text-center text-slate-500">Henüz iş planında açılacak olarak işaretlenen ürün yok.</td></tr>`;
            eslesmeyenTablo.innerHTML = eslesmeyenHtmlContent || `<tr><td colspan="4" class="p-6 text-center text-slate-500">Harika! İşaretlenmemiş eşleşmeyen ürün kalmadı.</td></tr>`;

            document.getElementById('ozetIcerik').innerHTML = `
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-2xl font-bold text-blue-600">${tsoftData.length}</div>
                    <div class="text-sm text-slate-500 mt-1">T-Soft Ürün</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-2xl font-bold text-slate-700">${eslesenSayisi}</div>
                    <div class="text-sm text-slate-500 mt-1">Eşleşen Ürün</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-2xl font-bold text-red-600">${hataSayisi}</div>
                    <div class="text-sm text-slate-500 mt-1">Kritik Hata</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-2xl font-bold text-amber-600">${acilicakSayisi}</div>
                    <div class="text-sm text-slate-500 mt-1">Açılacak (İş Planında)</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-2xl font-bold text-slate-500">${eslesmeyenSayisi}</div>
                    <div class="text-sm text-slate-500 mt-1">Bekleyen</div>
                </div>
            `;
        }
    </script>
